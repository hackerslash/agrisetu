name: Deploy To Server

# Keyless deploy via AWS SSM (replaces SSH/appleboy). No DEPLOY_SSH_KEY,
# DEPLOY_HOST or DEPLOY_USER secrets are used. The only secret required is
# AWS_ROLE_ARN (see docs/DEPLOYMENT.md §1). Provisioned by the AimpathyMinds
# platform team — PI14-plt-aip Track 9 (ADR PI14-agri-0001 §Addendum 2026-05-15).
# Old SSH command preserved verbatim in docs/DEPLOYMENT.md §Rollback.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  id-token: write      # REQUIRED: lets GitHub mint the AWS OIDC token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Assume AWS deploy role (keyless OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Resolve app instance id (by tag — survives box rebuild)
        id: target
        run: |
          IID=$(aws ssm describe-instance-information \
            --filters "Key=tag:Name,Values=ampy-agri-prod-ls-app" \
            --query "InstanceInformationList[0].InstanceId" --output text)
          if [ -z "$IID" ] || [ "$IID" = "None" ]; then
            echo "::error::app box not registered with SSM (PingStatus not Online). Contact the AimpathyMinds platform team — see docs/DEPLOYMENT.md §Troubleshooting."
            exit 1
          fi
          echo "iid=$IID" >> "$GITHUB_OUTPUT"

      - name: Send deploy command via SSM
        id: ssm
        run: |
          CMD=$(aws ssm send-command \
            --document-name ampy-agri-deploy \
            --targets "Key=tag:product,Values=agri" \
                      "Key=tag:Name,Values=ampy-agri-prod-ls-app" \
            --comment "CI deploy run ${{ github.run_id }} (${{ github.sha }})" \
            --parameters 'Commands=["set -euo pipefail","cd /opt/agrisetu","git checkout main","git pull --ff-only origin main","npm ci","npm run db:migrate","npm run build --workspace=apps/api","npm run build --workspace=apps/web","systemctl restart agrisetu-api agrisetu-web","systemctl reload nginx"],ExecutionTimeout=["2700"]' \
            --query Command.CommandId --output text)
          echo "cmd=$CMD" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command $CMD to ${{ steps.target.outputs.iid }}"

      - name: Wait for deploy to finish + surface output
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.ssm.outputs.cmd }}" \
            --instance-id "${{ steps.target.outputs.iid }}" || true
          aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.cmd }}" \
            --instance-id "${{ steps.target.outputs.iid }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${{ steps.ssm.outputs.cmd }}" \
            --instance-id "${{ steps.target.outputs.iid }}" \
            --query Status --output text)
          echo "SSM invocation status: $STATUS"
          [ "$STATUS" = "Success" ] || { echo "::error::deploy did not succeed (status=$STATUS)"; exit 1; }
